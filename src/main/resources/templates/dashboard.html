<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <main id="content" class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <h2 class="mb-0">Dashboard de Chamados</h2>
                <small class="text-muted">Atualizado às <span id="ultimaAtualizacao">--</span></small>
            </div>

            <form id="filtros" class="card card-body mt-3">
                <div class="row g-2">
                    <div class="col-md-2">
                        <label for="inicio" class="form-label">Abertura de</label>
                        <input type="date" class="form-control" id="inicio" name="inicio">
                    </div>
                    <div class="col-md-2">
                        <label for="fim" class="form-label">Até</label>
                        <input type="date" class="form-control" id="fim" name="fim">
                    </div>
                    <div class="col-md-2">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="">Todos</option>
                            <option>Aberto</option>
                            <option>Em andamento</option>
                            <option>Concluído</option>
                            <option>Cancelado</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="tipo" class="form-label">Tipo</label>
                        <input type="text" class="form-control" id="tipo" name="tipo">
                    </div>
                    <div class="col-md-2">
                        <label for="tecnico" class="form-label">Técnico</label>
                        <input type="text" class="form-control" id="tecnico" name="tecnico">
                    </div>
                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary">Filtrar</button>
                        <button type="button" class="btn btn-outline-secondary" id="limpar">Limpar</button>
                    </div>
                </div>
            </form>

            <div id="mensagem" class="alert d-none mt-3"></div>

            <div class="row g-3 mt-1">
                <div class="col"><div class="card card-body text-center"><span>Total</span><strong class="fs-2 text-primary" id="total">0</strong></div></div>
                <div class="col"><div class="card card-body text-center"><span>Abertos</span><strong class="fs-2 text-primary" id="abertos">0</strong></div></div>
                <div class="col"><div class="card card-body text-center"><span>Em andamento</span><strong class="fs-2 text-primary" id="emAndamento">0</strong></div></div>
                <div class="col"><div class="card card-body text-center"><span>Concluídos</span><strong class="fs-2 text-primary" id="concluidos">0</strong></div></div>
                <div class="col"><div class="card card-body text-center"><span>Tempo médio (dias)</span><strong class="fs-2 text-primary" id="tempoMedioDias">0</strong></div></div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <div class="card card-body h-100">
                        <h5>Chamados atendidos por período</h5>
                        <canvas id="graficoPeriodo"></canvas>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-body h-100">
                        <h5>Situação dos chamados</h5>
                        <canvas id="graficoStatus"></canvas>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card card-body h-100">
                        <h5>Tipos mais atendidos</h5>
                        <table class="table table-sm mb-0">
                            <thead><tr><th>Tipo</th><th>Chamados</th></tr></thead>
                            <tbody id="rankingTipos"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card card-body mt-3 mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h5>Chamados</h5>
                    <button type="button" class="btn btn-sm btn-primary" id="atualizar">Atualizar</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-sm table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Tipo</th>
                                <th>Técnico</th>
                                <th>Usuário</th>
                                <th>Abertura</th>
                                <th>Conclusão</th>
                                <th>Observação técnica</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaChamados"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
        <script th:src="@{/js/script.js}"></script>
        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
